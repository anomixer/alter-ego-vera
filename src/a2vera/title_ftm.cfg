FEATURES {
    STARTADDRESS: default = $2000;
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor, label = __DESTRUCTOR_TABLE__, count = __DESTRUCTOR_COUNT__, segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__, count = __INTERRUPTOR_COUNT__, segment = RODATA, import = __CALLIRQ__;
}
SYMBOLS {
    __FILETYPE__: type = weak, value = $0006;
    __STACKSIZE__: type = weak, value = $0140;
    __HIMEM__: type = weak, value = $9600;
    __STACKSTART__: type = weak, value = __HIMEM__;
}
MEMORY {
    ZP:   start = $0080, size = $001A, type = rw, file = "", define = yes;
    RAM:  start = $2000, size = $9300-$2000, type = rw, file = %O, fill = yes, define = yes;
    BSS:  start = __ONCE_RUN__, size = $6750-__ONCE_RUN__, type = rw, file = "";
    FTM_EXTRA_BSS: start = $8400, size = $0100, type = rw, file = "";
    FTM_HIGH_BSS: start = $93A0, size = $0120, type = rw, file = "";
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    STARTUP:  load = RAM, type = ro;
    LOWCODE:  load = RAM, type = ro, optional = yes;
    CODE:     load = RAM, type = ro;
    RODATA:   load = RAM, type = ro;
    DATA:     load = RAM, type = rw, define = yes;
    INIT:     load = RAM, type = rw, optional = yes;
    ASSETS:   load = RAM, type = ro;
    ONCE:     load = RAM, type = ro, define = yes;
    FTMDATA:  load = RAM, type = ro, start = $6750;
    FTMSFX:   load = RAM, type = ro, start = $819D;
    FTMTABLE: load = RAM, type = ro, start = $8500;
    BSS:      load = BSS, type = bss, define = yes;
    FTM_EXTRA_BSS: load = FTM_EXTRA_BSS, type = bss;
    FTM_HIGH_BSS: load = FTM_HIGH_BSS, type = bss;
}
